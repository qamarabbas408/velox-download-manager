[package]
name = "tauri-app"
version = "0.6.0"
description = "Velox — a fast, segmented download manager for Mac & Windows"
authors = ["Qamar Abbas (TheDigiOrb)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "net"] }
futures-util = "0.3"
velox-protocol = { path = "../crates/velox-protocol" }
base64 = "0.22"
tauri-plugin-store = "2.4.4"
tauri-plugin-clipboard-manager = "2"
sysinfo = "0.33"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
chrono = "0.4.45"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

